[package]
name = "varchar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native CLI for the varchar one-string database"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["database", "regex", "sql", "cli"]
categories = ["command-line-utilities", "database-implementations"]

[[bin]]
name = "varchar"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
varchar = { path = "../varchar", version = "0.1.1" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
