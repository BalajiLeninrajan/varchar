[package]
name = "varchar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native CLI for the varchar one-string database"
publish = false

[[bin]]
name = "varchar"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
varchar = { path = "../varchar" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
